<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kale Düellosu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Nunito+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: night-time duel, cinematic, tense but playful between two people
IDEA: a war table lit by elemental fire — dark silhouettes, glowing magic
PICTURE: the battlefield canvas itself, full screen, landscape
COLOUR and TYPE: near-black grounds, each element owns its glow; Cinzel headings, Nunito Sans UI
LAYOUT: canvas fills the screen, HUD on top edge, action bar on bottom edge, overlays for phases
*/
:root{color-scheme:dark;--bg:#07070a;--ink:#f1ece4;--mut:#9b958c;--line:rgba(255,255,255,.12);--glass:rgba(10,10,14,.72);--gold:#ffd257;
--fire:#ff6a2b;--water:#3cc8ff;--earth:#e0a440;--air:#bff5ee}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Nunito Sans",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;border-radius:6px;box-shadow:0 0 0 1px #000,0 20px 80px #000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:calc(var(--u)*1) calc(var(--u)*1.2);pointer-events:none;gap:8px}
.pl{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:calc(var(--u)*.6) calc(var(--u)*.9);width:calc(var(--u)*24);backdrop-filter:blur(6px)}
.pl.r{text-align:right}
.pl .nm{display:flex;gap:6px;align-items:center;font-weight:800;font-size:calc(var(--u)*1.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.r .nm{flex-direction:row-reverse}
.pl .el{font-weight:700;font-size:calc(var(--u)*1.05);opacity:.9}
.dots{display:inline-flex;gap:3px}.dots i{width:calc(var(--u)*.8);height:calc(var(--u)*.8);border-radius:50%;border:1px solid var(--gold);display:inline-block}.dots i.on{background:var(--gold)}
.bar{height:calc(var(--u)*.9);background:rgba(255,255,255,.08);border-radius:9px;overflow:hidden;margin-top:calc(var(--u)*.4);position:relative}
.bar b{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#ff4d4d,#ffb04d);border-radius:9px;transition:width .4s}
.pl.r .bar b{inset:0 0 0 auto}
.bar.en b{background:linear-gradient(90deg,var(--c),#fff)}
.bar span{position:absolute;inset:0;font-size:calc(var(--u)*.75);line-height:calc(var(--u)*.9);font-weight:800;padding:0 6px;text-shadow:0 1px 2px #000}
.mini{display:flex;gap:6px;margin-top:calc(var(--u)*.35);font-size:calc(var(--u)*.9);color:var(--mut);flex-wrap:wrap}
.pl.r .mini{justify-content:flex-end}
.mini em{font-style:normal;color:var(--ink)}
.mini .dead{color:#ff6b6b;text-decoration:line-through}
.fx{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap;min-height:calc(var(--u)*1.3)}.pl.r .fx{justify-content:flex-end}
.fx span{font-size:calc(var(--u)*.8);padding:0 5px;border-radius:6px;background:rgba(255,255,255,.1);font-weight:700;white-space:nowrap}
.mid{text-align:center;background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:calc(var(--u)*.5) calc(var(--u)*1);min-width:calc(var(--u)*15)}
.mid .rd{font-family:Cinzel,serif;font-size:calc(var(--u)*1.05);color:var(--mut)}
.mid .tn{font-weight:800;font-size:calc(var(--u)*1.25)}
.wind{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:calc(var(--u)*1.1)}
.wind svg{width:calc(var(--u)*4);height:calc(var(--u)*1.6)}
.tm{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:4px;overflow:hidden}.tm b{display:block;height:100%;background:var(--gold)}
#act{position:absolute;left:0;right:0;bottom:0;padding:calc(var(--u)*.8);display:none;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#act.on{display:flex}
#act .hint{font-size:calc(var(--u)*1.05);background:var(--glass);padding:3px 10px;border-radius:8px;color:#e8e2d8;max-width:90%;text-align:center}
#act .row{display:flex;gap:calc(var(--u)*.8);pointer-events:auto;max-width:100%;overflow-x:auto;padding:2px}
.grp{display:flex;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px;backdrop-filter:blur(6px)}
.ic{width:1.25em;height:1.25em;flex:none;vertical-align:-.25em;display:inline-block}
.ch{appearance:none;border:1px solid transparent;background:rgba(255,255,255,.06);color:var(--ink);border-radius:9px;padding:calc(var(--u)*.45) calc(var(--u)*.8);font:700 calc(var(--u)*1.05)/1.15 "Nunito Sans",sans-serif;cursor:pointer;min-height:40px;text-align:left;white-space:nowrap;display:inline-flex;align-items:center;gap:calc(var(--u)*.6)}
.ch>.ic{width:calc(var(--u)*2.3);height:calc(var(--u)*2.3);min-width:18px;min-height:18px;color:var(--c,#fff);filter:drop-shadow(0 0 4px var(--c,transparent))}
.ch.gold>.ic{color:var(--gold)}
.fx span .ic{width:1.1em;height:1.1em;margin-right:2px}
.ec li .ic{color:var(--c);margin-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:6px}.legend span{display:inline-flex;align-items:center;gap:5px}
.ch small{display:block;font-weight:700;opacity:.7;font-size:calc(var(--u)*.85)}
.ch.sel{border-color:var(--c,#fff);background:rgba(255,255,255,.14);box-shadow:0 0 12px -2px var(--c,#fff) inset}
.ch:disabled{opacity:.35}
.ch.used{opacity:.5}
.ch.gold{color:var(--gold)}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,4,7,.72);backdrop-filter:blur(3px);padding:calc(var(--u)*2);overflow:auto}
#ov.on{display:flex}
.card{background:linear-gradient(180deg,rgba(28,26,30,.96),rgba(12,12,16,.96));border:1px solid var(--line);border-radius:16px;padding:calc(var(--u)*2.2);max-width:min(96%,980px);width:100%;max-height:100%;overflow:auto;box-shadow:0 30px 80px #000}
h1,h2{font-family:Cinzel,serif;margin:0 0 .3em;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(28px,calc(var(--u)*5),56px);font-weight:800;letter-spacing:.02em}
h2{font-size:clamp(20px,calc(var(--u)*2.6),32px)}
.sub{color:var(--mut);margin:0 0 1em}
.btn{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font:800 16px "Nunito Sans",sans-serif;padding:12px 18px;border-radius:12px;cursor:pointer;min-height:46px}
.btn.pri{background:linear-gradient(180deg,#ff8a3d,#d9481b);border-color:#ff9b5a;color:#fff}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
input.tx{font:700 17px "Nunito Sans",sans-serif;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#0c0c10;color:var(--ink);width:100%;max-width:340px;min-height:46px}
input.tx:focus,.btn:focus-visible,.ch:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.ec{border:1px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.04);cursor:pointer;text-align:left;color:var(--ink);font:inherit;position:relative;overflow:hidden}
.ec:disabled{opacity:.35;cursor:default}
.ec h3{font-family:Cinzel,serif;margin:0;font-size:20px;color:var(--c)}
.ec .ds{color:var(--mut);font-size:13px;margin:2px 0 8px}
.ec ul{margin:0;padding:0;list-style:none;font-size:13px}
.ec li{padding:1px 0}
.ec .tag{position:absolute;right:10px;top:10px;font-size:12px;font-weight:800;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:8px}
.ec::after{content:"";position:absolute;inset:auto -30% -60% -30%;height:80%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.18;pointer-events:none}
.good{color:#8dffa9}.bad{color:#ff8a8a}
.mapc{border-radius:14px;padding:12px;border:1px solid var(--line);background:linear-gradient(180deg,var(--s1),var(--s2));color:#fff;text-align:left;font:inherit;cursor:pointer}
.mapc h3{font-family:Cinzel,serif;margin:0 0 4px;font-size:19px}
.mapc p{margin:0 0 6px;font-size:13px;opacity:.85}
.mapc table{font-size:12.5px;border-collapse:collapse;width:100%}
.mapc td{padding:1px 4px 1px 0;vertical-align:top}
.code{font-family:Cinzel,serif;font-size:56px;letter-spacing:.18em;color:var(--gold);margin:6px 0}
.upr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.upr b{display:block}.upr small{color:var(--mut)}
#toasts{position:absolute;left:50%;top:calc(var(--u)*16.5);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:80%}
.toast{background:var(--glass);border:1px solid var(--line);padding:5px 12px;border-radius:10px;font-weight:800;font-size:calc(var(--u)*1.2);animation:tin 2.8s forwards;text-align:center}
@keyframes tin{0%{opacity:0;transform:translateY(-6px)}10%,80%{opacity:1;transform:none}100%{opacity:0}}
#pop{position:absolute;right:calc(var(--u)*1);bottom:calc(var(--u)*7.5);display:none;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:6px;gap:4px;flex-direction:column;pointer-events:auto;backdrop-filter:blur(8px)}
#pop.on{display:flex}
#net{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:12px;color:#ffb3b3;background:rgba(0,0,0,.6);padding:2px 10px;border-radius:8px;display:none}
#rot{position:fixed;inset:0;background:#07070a;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:9;font-family:Cinzel,serif;font-size:22px}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
.corner{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--u)*11.2);display:flex;gap:6px;pointer-events:auto}
.icb{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);border-radius:8px;width:30px;height:26px;padding:0;font:800 12px sans-serif;cursor:pointer;opacity:.75}
.how{font-size:14px;color:#d6d0c6;columns:2 240px;margin-top:8px}
.how p{margin:0 0 8px;break-inside:avoid}
@media (prefers-reduced-motion:reduce){.toast{animation-duration:3s}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="hud" id="hud"></div>
  <div id="toasts"></div>
  <div id="act"><div class="hint" id="hint"></div><div class="row" id="row"></div></div>
  <div id="pop"></div>
  <div class="corner" id="corner"><button class="icb" id="snd" aria-label="Ses">♪</button><button class="icb" id="fs" aria-label="Tam ekran">⤢</button></div>
  <div id="net"></div>
  <div id="ov"></div>
</div>
<div id="rot">Telefonu yan çevir<br>⟳</div>
